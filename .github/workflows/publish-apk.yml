name: Build and publish Sony Android TV APK
on:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            curl --fail --location --retry 3 --output /tmp/android-commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p /tmp/android-commandlinetools
            unzip -q /tmp/android-commandlinetools.zip -d /tmp/android-commandlinetools
            mv /tmp/android-commandlinetools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk ../BeHocRoiXemTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BeHocRoiXemTV-Lop6-APK
          path: BeHocRoiXemTV.apk
          if-no-files-found: error
      - name: Publish latest APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: "Bé học rồi xem TV"
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: BeHocRoiXemTV.apk
          body: |
            Phiên bản 0.4: 100 câu hỏi; mỗi lượt cần 3 câu đúng; trả lời sai tăng thêm 1 câu cần đúng; 60 phút hiển thị nhắc nghỉ và màn hình mã phụ huynh.
            Cần cấp quyền hiển thị trên ứng dụng khác. Mã phụ huynh mặc định được thiết lập trong ứng dụng.
            Giới hạn kỹ thuật: ứng dụng lớp phủ không thể bảo đảm khóa hoàn toàn Android TV hoặc HDMI.
